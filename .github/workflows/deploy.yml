name: Deploy to Vercel

on:
  push:
    branches:
      - main

# Project + org are not secret; the token is. Root Directory (app/) travels with
# the project settings that `vercel pull` fetches, so these run from the repo root.
env:
  VERCEL_ORG_ID: team_yWApM5WevexoWHGPpyXGzne3
  VERCEL_PROJECT_ID: prj_Z9h3O0Lkd6allgyHrVESRRkX68SD

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
